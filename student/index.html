<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BSWL Student</title>
<meta name="description" content="Know what to study next, and why.">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BSWL Student">
<style>
/* ══════════════════════════════════════════════════════════════════════
   BSWL STUDENT v3
   The loop: open, see one action, start it in one tap, finish something
   small, get told what it changed, know what is next.

   COLOUR NOTE: monochrome is a locked client rule ("super ugly, I like the
   white and black"). So state is never carried by colour: every status has
   an icon, a word, or a weight. Semantic tokens exist but are deliberately
   neutral. Both themes are first-class.
   ══════════════════════════════════════════════════════════════════════ */

/* ── TOKENS ─────────────────────────────────────────────────────────── */
:root{
 --sat:env(safe-area-inset-top,0px);
 --sab:env(safe-area-inset-bottom,0px);

 /* type scale */
 --t-xs:12px; --t-sm:13px; --t-base:15px; --t-md:16px; --t-lg:18px;
 --t-xl:21px; --t-2xl:26px; --t-3xl:32px;
 --lh-tight:1.2; --lh-snug:1.35; --lh:1.5;

 /* spacing */
 --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
 --s8:32px; --s10:40px; --s12:48px;

 /* shape */
 --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;

 /* motion */
 --m-fast:120ms; --m-base:220ms; --m-slow:320ms;
 --ease:cubic-bezier(.2,.8,.2,1);

 /* dark (default) */
 --bg:#0d0d0d; --surface:#161616; --surface-2:#1e1e1e; --surface-3:#262626;
 --text:#f7f7f7; --text-2:#b4b4b4; --text-3:#8a8a8a;
 --line:#2a2a2a; --line-2:#3a3a3a;
 --accent:#f7f7f7; --on-accent:#0d0d0d;
 --focus:#8ab4ff;
 --scrim:rgba(0,0,0,.62);
}
@media(prefers-color-scheme:light){
 :root:not([data-theme="dark"]){
  --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f1f1f3; --surface-3:#e8e8ea;
  --text:#121212; --text-2:#5a5a5f; --text-3:#78787e;
  --line:#e3e3e6; --line-2:#d2d2d7;
  --accent:#121212; --on-accent:#ffffff;
  --scrim:rgba(0,0,0,.34);
 }
}
:root[data-theme="light"]{
 --bg:#f6f6f7; --surface:#ffffff; --surface-2:#f1f1f3; --surface-3:#e8e8ea;
 --text:#121212; --text-2:#5a5a5f; --text-3:#78787e;
 --line:#e3e3e6; --line-2:#d2d2d7;
 --accent:#121212; --on-accent:#ffffff;
 --scrim:rgba(0,0,0,.34);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
 font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,Inter,system-ui,sans-serif;
 background:var(--bg);color:var(--text);font-size:var(--t-base);line-height:var(--lh);
 -webkit-font-smoothing:antialiased;
 padding-bottom:calc(64px + var(--sab));
 overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── SHELL ──────────────────────────────────────────────────────────── */
.statusfill{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--bg);z-index:60;pointer-events:none}
/* ── LOGIN ─────────────────────────────────────────────────── */
.login{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;
 align-items:center;justify-content:center;padding:var(--s5);
 padding-top:calc(var(--s5) + var(--sat));padding-bottom:calc(var(--s5) + var(--sab));
 overflow-y:auto}
.login.gone{display:none}
.login-in{width:100%;max-width:340px}
.lg-mark{width:44px;height:44px;color:var(--text-2);margin-bottom:var(--s5)}
.lg-t{font-size:var(--t-2xl);font-weight:680;letter-spacing:-.02em;line-height:1.1}
.lg-s{font-size:var(--t-sm);color:var(--text-2);margin:var(--s1) 0 var(--s6)}
.lg-err{font-size:var(--t-sm);color:var(--text);font-weight:600;margin-top:var(--s3);min-height:1.2em}
.lg-foot{font-size:var(--t-xs);color:var(--text-3);margin-top:var(--s5)}
.shell{max-width:600px;margin:0 auto;padding:0 var(--s4)}
.hdr{
 position:sticky;top:0;z-index:40;max-width:600px;margin:0 auto;
 padding:calc(var(--s3) + var(--sat)) var(--s4) var(--s3);
 display:flex;align-items:center;gap:var(--s3);
 background:var(--bg);
}
.hdr h1{font-size:var(--t-md);font-weight:650;letter-spacing:-.01em;line-height:1.1}
.hdr .sub{font-size:var(--t-xs);color:var(--text-3);margin-top:1px}
.hdr .mark{width:26px;height:26px;color:var(--text-2)}

h2{font-size:var(--t-lg);font-weight:650;letter-spacing:-.015em;line-height:var(--lh-tight)}
h3{font-size:var(--t-md);font-weight:600;letter-spacing:-.01em;line-height:var(--lh-snug)}
.lede{font-size:var(--t-sm);color:var(--text-2);line-height:var(--lh-snug)}
.meta{font-size:var(--t-xs);color:var(--text-3)}
.sect-h{display:flex;align-items:baseline;gap:var(--s3);margin:var(--s6) 0 var(--s3)}
.sect-h h2{flex:1;min-width:0;font-size:var(--t-md)}

/* ── SURFACES ───────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4)}
.stack>*+*{margin-top:var(--s3)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.rowbtn{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);min-height:56px;
 transition:background var(--m-fast) var(--ease)}
.rowbtn:active{background:var(--surface-2)}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn .chev{color:var(--text-3);width:18px;height:18px}

/* ── CONTROLS ───────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
 font-size:var(--t-base);font-weight:600;padding:0 var(--s5);min-height:48px;
 border-radius:var(--r-md);width:100%;text-align:center;
 transition:transform var(--m-fast) var(--ease),opacity var(--m-fast) var(--ease)}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-secondary{background:var(--surface-2);color:var(--text)}
.btn-quiet{color:var(--text-2)}
.btn-sm{min-height:40px;font-size:var(--t-sm);padding:0 var(--s4);width:auto}

.chipbar{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding-bottom:var(--s1);margin:0 calc(var(--s4)*-1);padding-inline:var(--s4)}
.chipbar::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:var(--t-sm);font-weight:550;padding:var(--s2) var(--s3);min-height:36px;
 border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-2);
 display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.seg{display:flex;gap:2px;background:var(--surface-2);border-radius:var(--r-md);padding:3px}
.seg button{flex:1;text-align:center;font-size:var(--t-sm);font-weight:600;min-height:38px;
 border-radius:calc(var(--r-md) - 3px);color:var(--text-2);
 transition:background var(--m-fast) var(--ease),color var(--m-fast) var(--ease)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}

input,select,textarea{font:inherit;color:var(--text);background:var(--surface-2);
 border:1px solid var(--line-2);border-radius:var(--r-md);padding:var(--s3);width:100%;min-height:48px}
input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
label{display:block;font-size:var(--t-sm);font-weight:600;margin-bottom:var(--s2)}

/* ── PRIMARY TASK ───────────────────────────────────────────────────── */
.primary{background:var(--accent);color:var(--on-accent);border-radius:var(--r-xl);padding:var(--s5);border:none}
.primary .kind{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:650;
 letter-spacing:.02em;opacity:.62;margin-bottom:var(--s2)}
.primary h2{font-size:var(--t-2xl);letter-spacing:-.02em;margin-bottom:var(--s2)}
.primary .why{font-size:var(--t-sm);opacity:.66;line-height:var(--lh-snug)}
.primary .btn{margin-top:var(--s5);background:var(--on-accent);color:var(--accent)}
.primary .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;flex:none}

/* block, not inline: these are stacked lines inside a button, and inline
   spans silently run the title into the subtitle ("NextSaturday 18 Jul") */
.tt{display:block;font-size:var(--t-base);font-weight:550;line-height:var(--lh-snug)}
.tw{display:block;font-size:var(--t-xs);color:var(--text-3);margin-top:3px;line-height:var(--lh-snug)}

/* ── STATUS (never colour alone) ────────────────────────────────────── */
.stat{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);color:var(--text-3)}
.stat svg{width:13px;height:13px}
.stat.on{color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:600;
 padding:3px 9px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--text-2)}
.pill.solid{background:var(--accent);color:var(--on-accent)}

/* ── SYLLABUS ───────────────────────────────────────────────────────── */
.unit-h{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);min-height:52px}
.unit-h .un{font-size:var(--t-base);font-weight:600;flex:1;min-width:0}
.unit-h .uc{font-size:var(--t-xs);color:var(--text-3)}
.unit-h .caret{transition:transform var(--m-base) var(--ease);color:var(--text-3);width:18px;height:18px}
.unit-h[aria-expanded="true"] .caret{transform:rotate(90deg)}
.topic{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s3) var(--s4);min-height:60px;
 transition:background var(--m-fast) var(--ease)}
.topic:active{background:var(--surface-2)}
.topic .tn{font-size:var(--t-base);font-weight:500;line-height:var(--lh-snug)}
.topic.future .tn{color:var(--text-3);font-weight:400}
.topic .tsub{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:3px}
.conf{width:32px;height:32px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);
 display:flex;align-items:center;justify-content:center;color:var(--text-3);
 transition:background var(--m-fast) var(--ease)}
.conf svg{width:15px;height:15px}
.conf.got{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.conf.shaky{border-color:var(--text-2);color:var(--text)}
.conf.lost{border-style:dashed;border-color:var(--text-2);color:var(--text-2)}

/* ── TASK FLOW (full screen, not a trap) ────────────────────────────── */
.flow{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;overflow-y:auto}
.flow.on{display:flex;animation:flowIn var(--m-base) var(--ease)}
@keyframes flowIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.flow-top{position:sticky;top:0;z-index:2;background:var(--bg);
 padding:calc(var(--s3) + var(--sat)) var(--s4) var(--s3);display:flex;align-items:center;gap:var(--s3)}
.flow-top .ic-btn{width:40px;height:40px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;
 background:var(--surface-2);color:var(--text);flex:none}
.flow-prog{flex:1;height:3px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.flow-prog i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);
 transition:width var(--m-slow) var(--ease)}
.flow-body{flex:1;max-width:600px;width:100%;margin:0 auto;padding:var(--s4) var(--s4) var(--s10)}
.flow-foot{position:sticky;bottom:0;background:var(--bg);max-width:600px;width:100%;margin:0 auto;
 padding:var(--s3) var(--s4) calc(var(--s4) + var(--sab));border-top:1px solid var(--line)}
.flow h2{font-size:var(--t-2xl);letter-spacing:-.02em;margin-bottom:var(--s2)}
.qopt{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--s4);min-height:60px;
 border:1.5px solid var(--line-2);border-radius:var(--r-md);margin-top:var(--s3);
 font-size:var(--t-base);line-height:var(--lh-snug);
 transition:border-color var(--m-fast) var(--ease),background var(--m-fast) var(--ease)}
.qopt .mk{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);
 display:flex;align-items:center;justify-content:center;color:transparent}
.qopt[aria-checked="true"]{border-color:var(--accent);background:var(--surface-2)}
.qopt[aria-checked="true"] .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.qopt[data-r="right"]{border-color:var(--text);background:var(--surface-2)}
.qopt[data-r="wrong"]{border-style:dashed;border-color:var(--text-2)}
.qopt[data-r="wrong"] .mk{background:transparent;border-color:var(--text-2);color:var(--text-2)}
.qopt[data-r="right"] .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.verdict{border-left:2px solid var(--accent);padding-left:var(--s3);margin-top:var(--s5)}
.verdict .vt{font-size:var(--t-md);font-weight:650;margin-bottom:var(--s1)}
.keyterm{display:flex;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line)}
.keyterm b{font-size:var(--t-sm);min-width:104px;flex:none}
.keyterm span{font-size:var(--t-sm);color:var(--text-2)}
.done-mark{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);
 display:flex;align-items:center;justify-content:center;margin-bottom:var(--s4);
 animation:pop var(--m-slow) var(--ease)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* ── SHEET ──────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex;animation:fade var(--m-fast) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;width:100%;max-width:600px;
 padding:var(--s3) var(--s4) calc(var(--s5) + var(--sab));max-height:88vh;overflow-y:auto;
 animation:up var(--m-base) var(--ease)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:36px;height:4px;border-radius:var(--r-pill);background:var(--line-2);margin:0 auto var(--s4)}
.sheet h3{margin-bottom:var(--s1)}

/* ── FEEDBACK ───────────────────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:calc(76px + var(--sab));transform:translateX(-50%) translateY(10px);
 z-index:90;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2);
 border-radius:var(--r-md);padding:var(--s3) var(--s4);font-size:var(--t-sm);font-weight:550;
 display:flex;align-items:center;gap:var(--s4);max-width:calc(100vw - 32px);
 opacity:0;pointer-events:none;transition:opacity var(--m-base) var(--ease),transform var(--m-base) var(--ease);
 box-shadow:0 8px 24px rgba(0,0,0,.24)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{font-weight:650;color:var(--text);text-decoration:underline;flex:none;min-height:32px}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
 padding:var(--s3);font-size:var(--t-sm);color:var(--text-2);display:flex;gap:var(--s3);align-items:flex-start}
.offline-bar{position:fixed;top:var(--sat);left:0;right:0;z-index:65;background:var(--accent);color:var(--on-accent);
 font-size:var(--t-xs);font-weight:650;text-align:center;padding:6px;display:none}
.empty{text-align:center;padding:var(--s8) var(--s4)}
.empty .ei{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--text-2);
 display:flex;align-items:center;justify-content:center;margin:0 auto var(--s4)}
.skel{background:var(--surface-2);border-radius:var(--r-sm);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── PROGRESS ───────────────────────────────────────────────────────── */
.metric{display:flex;align-items:baseline;gap:var(--s2)}
.metric b{font-size:var(--t-3xl);font-weight:680;letter-spacing:-.03em;line-height:1}
.metric span{font-size:var(--t-sm);color:var(--text-2)}
.track{height:6px;background:var(--surface-2);border-radius:var(--r-pill);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width var(--m-slow) var(--ease)}
.track.ghost i{background:var(--line-2)}
.mile{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0}
.mile .mn{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;
 display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:650;color:var(--text-3)}
.mile.done .mn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ── TABS ───────────────────────────────────────────────────────────── */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;
 max-width:600px;margin:0 auto;background:var(--bg);border-top:1px solid var(--line);
 padding-bottom:var(--sab)}
.tabs button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 color:var(--text-3);font-size:11px;font-weight:600;text-align:center;
 transition:color var(--m-fast) var(--ease)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--text)}
/* ── SPLASH. It replaces a blank launch, it must never become one. Cold start
   only, time-boxed, tap anywhere to skip. ── */
.splash{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--text);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 padding:var(--s6);text-align:center;transition:opacity var(--m-slow) var(--ease)}
.splash.gone{opacity:0;pointer-events:none}
.sp-mark{width:60px;height:60px;color:var(--text);margin-bottom:var(--s5)}
.sp-name{font-size:var(--t-sm);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
 color:var(--text-3);margin-bottom:var(--s6)}
.sp-line{font-size:var(--t-xl);font-weight:600;line-height:1.35;letter-spacing:-.015em;max-width:19ch}
.sp-foot{position:absolute;bottom:calc(var(--s8) + var(--sab));font-size:var(--t-xs);color:var(--text-3)}
@media(prefers-reduced-motion:no-preference){
 .sp-mark{animation:spUp .45s var(--ease) both}
 .sp-name{animation:spUp .45s var(--ease) .06s both}
 .sp-line{animation:spUp .5s var(--ease) .12s both}
}
@keyframes spUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.screen{display:none;animation:sIn var(--m-base) var(--ease)}
.screen.on{display:block}
@keyframes sIn{from{opacity:0}to{opacity:1}}

@media(max-width:340px){
 .primary h2{font-size:var(--t-xl)}
 .metric b{font-size:var(--t-2xl)}
 .tabs button{font-size:10px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="splash" id="splash" role="status" aria-live="polite" onclick="hideSplash()">

<script>
/* ══════════════════════════════════════════════════════════════════════
   DATA + CLOCK. Demo: in-memory, reseeds clean on reload (BB demo rule).
   AS_OF must equal the staff OS demo date or the two surfaces disagree
   about which classes happened.
   ══════════════════════════════════════════════════════════════════════ */
var CFG={
 wa:'94771396173',
 exam:{date:'2027-08-16',label:'A/L Business Studies'},
 klass:{dow:6,label:'Saturday',where:'Kings, Nugegoda'},
 asOf:'2026-07-15'
};
var AS_OF=new Date(CFG.asOf+'T09:41:00');
function todayISO(){var d=AS_OF;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtD(iso){var p=iso.split('-');return +p[2]+' '+MN[+p[1]-1];}
function dowName(iso){return DY[new Date(iso+'T00:00:00').getDay()];}
function shift(iso,n){var p=iso.split('-');var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}

/* SYLLABUS. PLACEHOLDER, NEEDS LEON. Ids must match the staff OS exactly. */
var SYLLABUS=[
 {u:'1',name:'The nature of business',topics:[['1.1','What a business does'],['1.2','Needs, wants and resources'],['1.3','Business objectives'],['1.4','Stakeholders']]},
 {u:'2',name:'The business environment',topics:[['2.1','Internal environment'],['2.2','Micro environment'],['2.3','Macro environment'],['2.4','Environment analysis']]},
 {u:'3',name:'Forms of business',topics:[['3.1','Sole proprietorship'],['3.2','Partnerships'],['3.3','Companies'],['3.4','State and cooperative bodies']]},
 {u:'4',name:'Management process',topics:[['4.1','Planning'],['4.2','Organising'],['4.3','Leading'],['4.4','Controlling']]},
 {u:'5',name:'Marketing',topics:[['5.1','Markets and customers'],['5.2','The marketing mix'],['5.3','Product and price'],['5.4','Promotion and place']]},
 {u:'6',name:'Human resources',topics:[['6.1','HR planning'],['6.2','Recruitment and selection'],['6.3','Training and development'],['6.4','Motivation']]},
 {u:'7',name:'Operations and finance',topics:[['7.1','Operations management'],['7.2','Sources of finance'],['7.3','Financial statements'],['7.4','Ratios and interpretation']]},
 {u:'8',name:'Business growth',topics:[['8.1','Small business and entrepreneurship'],['8.2','Growth strategies'],['8.3','International business']]}
];
function flatTopics(){var o=[];SYLLABUS.forEach(function(u){u.topics.forEach(function(t){o.push(t[0]);});});return o;}
function tName(id){var n='';SYLLABUS.forEach(function(u){u.topics.forEach(function(t){if(t[0]===id)n=t[1];});});return n;}
function tUnit(id){return id.split('.')[0];}
function unitName(u){var n='';SYLLABUS.forEach(function(x){if(x.u===u)n=x.name;});return n;}

/* TEACHING CONTENT. DRAFT, AWAITING LEON'S APPROVAL. Shown to the student
   with that label attached, because unapproved study material must never
   pose as the tutor's own teaching. */
var LESSON={
 '4.2':{
  summary:'Organising turns a plan into a working structure. You decide what jobs exist, who does them, who reports to whom, and how much authority each person holds.',
  terms:[['Organisation structure','How roles and reporting lines are arranged.'],
         ['Delegation','Passing authority down while keeping responsibility.'],
         ['Span of control','How many people report to one manager.']],
  qs:[{q:'Delegation means a manager passes down',
       opts:['authority, while staying responsible for the result','both authority and responsibility, entirely','responsibility only, keeping all authority'],a:0,
       why:'Authority moves down the structure. Responsibility for the outcome stays with the manager who delegated.'},
      {q:'A wide span of control usually means',
       opts:['one manager supervises many people','many managers supervise one person','fewer levels of delegation'],a:0,
       why:'Span of control counts direct reports. Wide spans mean flatter structures and looser supervision.'}]
 },
 '1.3':{
  summary:'Objectives are the targets a business sets itself. Good ones are specific and measurable, so the business can tell later whether it actually got there.',
  terms:[['Objective','A target the business works towards.'],['Mission','Why the business exists.']],
  qs:[{q:'The clearest business objective is',
       opts:['grow sales by 10% this year','do better than last year','be the best in the market'],a:0,
       why:'Specific and measurable. The other two cannot be checked at the end of the year.'}]
 },
 '2.3':{
  summary:'The macro environment is everything outside the firm that it cannot control: the economy, government policy, technology, society and law.',
  terms:[['Macro environment','Wide external forces beyond the firm.'],['Micro environment','Suppliers, customers and competitors close to the firm.']],
  qs:[{q:'A rise in national interest rates sits in the',
       opts:['macro environment','micro environment','internal environment'],a:0,
       why:'Interest rates are set nationally. No single firm can control them, so they are macro.'},
      {q:'A new competitor opening nearby belongs to the',
       opts:['micro environment','macro environment','internal environment'],a:0,
       why:'Competitors sit close to the firm and interact with it directly, so they are micro.'}]
 },
 '3.2':{
  summary:'A partnership is owned by two or more people who share profits as their agreement sets out. In an ordinary partnership the partners carry unlimited liability.',
  terms:[['Partnership deed','The agreement setting out shares and duties.'],['Unlimited liability','Personal assets are at risk for business debts.']],
  qs:[{q:'In an ordinary partnership, profits are shared',
       opts:['as the partnership agreement sets out','equally, always, by law','by the senior partner’s decision'],a:0,
       why:'The deed decides. Equal sharing applies only when no agreement says otherwise.'}]
 }
};
function hasLesson(t){return !!LESSON[t];}

/* class dates: same formula as the staff OS seed so absences line up */
function classDates(){var o=[];for(var w=9;w>=0;w--){o.push(shift(todayISO(),-(7*w+((7-new Date(todayISO().split('-')[0],+todayISO().split('-')[1]-1,+todayISO().split('-')[2]).getDay())%7))));}return o;}
function seedClassLog(){var flat=flatTopics(),dates=classDates(),out=[],done=0,total=16,per=total/dates.length;
 dates.forEach(function(d,i){var upto=Math.round(per*(i+1));var slice=flat.slice(done,Math.min(upto,total));done=Math.min(upto,total);
  if(slice.length)out.push({date:d,topics:slice});});return out;}

/* ── STUDENT LOGINS. Demo only: these credentials sit in the page source, so
   this is NOT authentication. Real student logins need the backend and proper
   auth before any real child's name, marks or attendance goes in. Three
   accounts on purpose, so the team can see three different states. ── */
var STUDENTS=[
 {user:'Nadun',pin:'1010',name:'Nadun Perera',batch:'2027',loc:'Kings, Nugegoda',
  program:'Theory',joined:'2026-01-10',level:'okay',seed:1,
  note:'Missed a class and has two gaps. The normal case.'},
 {user:'Ishara',pin:'2020',name:'Ishara Silva',batch:'2027',loc:'Residence',
  program:'Combined',joined:'2026-02-14',level:'good',seed:4,
  note:'Up to date. Shows what the app looks like with nothing owed.'},
 {user:'Kavindu',pin:'3030',name:'Kavindu Fernando',batch:'2028',loc:'JMC, Kiribathgoda',
  program:'Theory',joined:'2026-04-02',level:'bad',seed:2,
  note:'Behind on several topics. Shows the catch-up list working hard.'}
];
var ME=STUDENTS[0];
function seedAttendance(){var o=[];classDates().forEach(function(d,i){var w=9-i;
 o.push({date:d,present:((ME.seed*7+w*3)%10)!==0});});return o;}

var DB={
 classLog:seedClassLog(),
 attendance:seedAttendance(),
 conf:{'1.1':'got','1.2':'got','1.3':'got','1.4':'shaky','2.1':'got','2.2':'shaky','2.3':'got','3.1':'got','3.2':'lost','4.1':'shaky'},
 ev:{'1.1':{s:'demonstrated',d:'2026-06-06'},'1.2':{s:'demonstrated',d:'2026-06-06'},
     '1.3':{s:'developing',d:'2026-06-13'},'2.1':{s:'demonstrated',d:'2026-05-30'},
     '2.3':{s:'developing',d:'2026-07-04'},'3.1':{s:'demonstrated',d:'2026-07-04'}},
 tutes:{'1':'done','2':'done','3':'started','4':'assigned'},
 papers:[
  {date:'2026-03-14',paper:'2018 Paper I',q:'Q2',score:12,max:20,timed:false,marker:'self',err:'Answer structure'},
  {date:'2026-04-18',paper:'2019 Paper I',q:'Q1',score:14,max:20,timed:false,marker:'self',err:'Terminology'},
  {date:'2026-05-16',paper:'2019 Paper II',q:'Q3',score:13,max:20,timed:true,marker:'tutor',err:'Application'},
  {date:'2026-06-13',paper:'2020 Paper I',q:'Q2',score:15,max:20,timed:true,marker:'self',err:'Application'},
  {date:'2026-07-04',paper:'2021 Paper I',q:'Q1',score:16,max:20,timed:true,marker:'self',err:''}
 ],
 batch:{n:50,tuteRate:71,median:14},
 progressTask:null   /* resume state for an in-flight task */
};

/* ══ DERIVED ══ */
function covered(){var m={};DB.classLog.forEach(function(r){r.topics.forEach(function(t){m[t]=r.date;});});return m;}
function coveredCount(){return Object.keys(covered()).length;}
function evOf(t){return (DB.ev[t]&&DB.ev[t].s)||'untested';}
function evDate(t){return DB.ev[t]&&DB.ev[t].d;}
function evStale(t){var e=DB.ev[t];return !!(e&&e.d&&daysBetween(e.d,todayISO())>42&&e.s==='demonstrated');}
function shownCount(){return Object.keys(covered()).filter(function(t){return evOf(t)==='demonstrated';}).length;}
function missed(){return DB.attendance.filter(function(a){return !a.present;}).map(function(a){return a.date;});}
function attRate(){var n=DB.attendance.length;return n?DB.attendance.filter(function(a){return a.present;}).length/n:0;}
function lastClass(){return DB.classLog[DB.classLog.length-1];}
function nextClassISO(){for(var i=1;i<=7;i++){var d=shift(todayISO(),i);if(new Date(d+'T00:00:00').getDay()===CFG.klass.dow)return d;}return todayISO();}
function phaseHint(){var d=daysBetween(todayISO(),CFG.exam.date);
 if(d>300)return 'Build foundations before timed papers';
 if(d>150)return 'Topic questions and answer technique';
 if(d>90)return 'Timed sections and error repair';
 if(d>21)return 'Full papers and pacing';
 return 'Focused revision';}

/* ══ RECOMMENDATION ENGINE. Deterministic. Every item carries a reason,
   a duration and a start action that opens the real task. ══ */
function recommend(){
 var out=[],cov=covered(),miss=missed();
 DB.classLog.forEach(function(r){
  if(miss.indexOf(r.date)<0)return;
  r.topics.forEach(function(t){
   if(evOf(t)==='demonstrated')return;
   out.push({p:1,kind:'catchup',topic:t,mins:hasLesson(t)?9:6,
    title:'Catch up: '+tName(t),
    why:'You missed '+dowName(r.date)+'’s lesson'});
  });
 });
 Object.keys(DB.conf).forEach(function(t){
  if(DB.conf[t]==='got'&&evOf(t)==='developing')
   out.push({p:2,kind:'recheck',topic:t,mins:4,title:tName(t)+' needs another look',why:'Your last check found a gap'});
 });
 DB.papers.forEach(function(){});
 (function(){
  var e={};DB.papers.forEach(function(p){if(p.err)e[p.err]=(e[p.err]||0)+1;});
  var top=Object.keys(e).sort(function(a,b){return e[b]-e[a];})[0];
  if(top&&e[top]>=2)out.push({p:3,kind:'papers',mins:12,title:top.toLowerCase()==='application'?'Practise application':'Practise '+top.toLowerCase(),
   why:top+' cost you marks in '+e[top]+' attempts'});
 })();
 Object.keys(DB.conf).forEach(function(t){
  if(DB.conf[t]==='lost'&&cov[t])
   out.push({p:4,kind:'catchup',topic:t,mins:hasLesson(t)?9:6,title:'Rebuild: '+tName(t),why:'You marked this Lost'});
 });
 Object.keys(DB.tutes).forEach(function(u){
  var s=DB.tutes[u];
  if(s==='started')out.push({p:5,kind:'tute',unit:u,mins:20,title:'Finish the Unit '+u+' tute',why:'Started, not finished'});
  else if(s==='assigned')out.push({p:6,kind:'tute',unit:u,mins:25,title:'Start the Unit '+u+' tute',why:'Assigned for '+unitName(u).toLowerCase()});
 });
 Object.keys(DB.ev).forEach(function(t){
  if(evStale(t))out.push({p:7,kind:'recheck',topic:t,mins:3,title:'Recheck '+tName(t),why:'Not checked since '+fmtD(evDate(t))});
 });
 out.push({p:9,kind:'papers',mins:15,title:'Try a timed question',why:phaseHint()});
 out.sort(function(a,b){return a.p-b.p;});
 var recovery=out.filter(function(x){return x.p<=7;}).slice(0,3);
 return recovery.concat(out.filter(function(x){return x.p===9;})).slice(0,4);
}

/* ══ ICONS ══ */
var I={
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 caret:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 half:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
 dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5H6.5A2.5 2.5 0 0 0 4 21z"/></svg>',
 doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13H11l-.5 9L20 10.5h-6.5z"/></svg>',
 cross:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
};
var KIND={catchup:['Catch up',I.book],recheck:['Quick check',I.bolt],tute:['Tute',I.doc],papers:['Practice',I.doc]};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function say(m){document.getElementById('live').textContent=m;}

/* ══ TOAST with undo ══ */
var _undo=null,_tt=null;
function toast(msg,undoFn){
 var t=document.getElementById('toast'),a=document.getElementById('toastAct');
 document.getElementById('toastMsg').textContent=msg;
 _undo=undoFn||null;a.hidden=!undoFn;
 t.classList.add('on');say(msg);
 clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('on');},undoFn?5200:2600);
}
document.getElementById('toastAct').addEventListener('click',function(){
 if(_undo){_undo();_undo=null;}
 document.getElementById('toast').classList.remove('on');
});

/* ══ SHEET with focus trap + restore ══ */
var _lastFocus=null;
function openSheet(html){
 _lastFocus=document.activeElement;
 document.getElementById('sheetBody').innerHTML=html;
 document.getElementById('scrim').classList.add('on');
 var f=document.querySelector('#sheet button,#sheet a,#sheet input');if(f)f.focus();
}
function closeSheet(){
 document.getElementById('scrim').classList.remove('on');
 if(_lastFocus&&_lastFocus.focus)_lastFocus.focus();
}
document.getElementById('scrim').addEventListener('click',function(e){if(e.target.id==='scrim')closeSheet();});
document.addEventListener('keydown',function(e){
 if(e.key!=='Escape')return;
 if(document.getElementById('scrim').classList.contains('on'))closeSheet();
 else if(document.getElementById('flow').classList.contains('on'))exitFlow();
});

/* ══════════════════════════════════════════════════════════════════════
   THE TASK FLOW. This is the fix for the defect that mattered: a card
   that names a task now opens that exact task. Context, learn, retrieve,
   feedback, confidence, done. Exit keeps your place.
   ══════════════════════════════════════════════════════════════════════ */
var FLOW=null;
function startTask(rec){
 if(rec.kind==='tute'){openTuteSheet(rec.unit);return;}
 if(rec.kind==='papers'){show('learn');seg('papers');say('Papers');return;}
 var t=rec.topic;
 if(!hasLesson(t)){
  /* no approved lesson yet: be honest and route somewhere useful */
  openTopicSheet(t,'Leon has not added notes for this topic yet.');
  return;
 }
 FLOW=(DB.progressTask&&DB.progressTask.topic===t)?DB.progressTask
   :{topic:t,kind:rec.kind,step:0,answers:[],confBefore:DB.conf[t]||null};
 DB.progressTask=FLOW;
 document.getElementById('flow').classList.add('on');
 document.body.style.overflow='hidden';
 renderFlow();
}
function flowSteps(){var L=LESSON[FLOW.topic];return 2+L.qs.length+1;} /* context, learn, N questions, done */
function renderFlow(){
 var L=LESSON[FLOW.topic],total=flowSteps(),s=FLOW.step;
 document.getElementById('flowProg').style.width=Math.round(s/(total-1)*100)+'%';
 var body=document.getElementById('flowBody'),foot=document.getElementById('flowFoot');
 document.getElementById('flowBack').style.visibility=s===0?'hidden':'visible';

 if(s===0){
  var when=null;DB.classLog.forEach(function(r){if(r.topics.indexOf(FLOW.topic)>=0)when=r.date;});
  body.innerHTML='<div class="pill" style="margin-bottom:var(--s4)">'+KIND[FLOW.kind][0]+'</div>'
   +'<h2>'+esc(tName(FLOW.topic))+'</h2>'
   +'<p class="lede" style="margin-top:var(--s2)">'
   +(when?dowName(when)+'’s lesson covered this. ':'')+'Read the summary, then answer '+L.qs.length+' question'+(L.qs.length>1?'s':'')+'.</p>'
   +'<div class="banner" style="margin-top:var(--s5)">'+I.clock.replace('<svg','<svg width="18" height="18"')
   +'<div>About '+(L.qs.length>1?9:6)+' minutes. You can stop any time and pick it up here.</div></div>'
   +'<p class="meta" style="margin-top:var(--s4)">Topic '+FLOW.topic+'</p>';
  foot.innerHTML='<button class="btn btn-primary" onclick="flowNext()">Start</button>';
 }
 else if(s===1){
  body.innerHTML='<h2>The idea</h2><p style="margin-top:var(--s3);font-size:var(--t-md);line-height:var(--lh)">'+esc(L.summary)+'</p>'
   +'<div style="margin-top:var(--s6)">'+L.terms.map(function(k){
     return '<div class="keyterm"><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>';}).join('')+'</div>'
   +'<p class="meta" style="margin-top:var(--s5)">Draft notes, pending Leon’s approval.</p>';
  foot.innerHTML='<button class="btn btn-primary" onclick="flowNext()">I have read this</button>';
 }
 else if(s<2+L.qs.length){
  var qi=s-2,Q=L.qs[qi],picked=FLOW.answers[qi];
  var answered=picked!=null&&picked.locked;
  body.innerHTML='<p class="meta">Question '+(qi+1)+' of '+L.qs.length+'</p>'
   +'<h2 style="margin-top:var(--s2)">'+esc(Q.q)+'</h2>'
   +'<div role="radiogroup" aria-label="Answer options">'+Q.opts.map(function(o,i){
     var r='';
     if(answered){ if(i===Q.a)r=' data-r="right"'; else if(i===picked.pick)r=' data-r="wrong"'; }
     /* a tick on the option you got wrong reads as approval, so a wrong pick
        gets a cross and only the true answer keeps the tick */
     var mark=I.check;
     if(answered&&picked.pick===i&&i!==Q.a)mark=I.cross;
     var aria=answered?(i===Q.a?' aria-label="Correct answer: '+esc(o)+'"':'')
                      :'';
     return '<button class="qopt" role="radio" aria-checked="'+(picked&&picked.pick===i?'true':'false')+'"'+r+aria
      +(answered?' disabled':'')+' onclick="pick('+qi+','+i+')"><span class="mk">'+mark+'</span><span>'+esc(o)+'</span></button>';
   }).join('')+'</div>'
   +(answered?'<div class="verdict"><div class="vt">'+(picked.pick===Q.a?'That is right':'Not this one')+'</div>'
     +'<p class="lede">'+esc(Q.why)+'</p></div>':'');
  foot.innerHTML=answered
   ?'<button class="btn btn-primary" onclick="flowNext()">Continue</button>'
   :'<button class="btn btn-primary" id="qCheck" disabled onclick="lockAnswer('+qi+')">Check answer</button>';
  if(picked&&!picked.locked)document.getElementById('qCheck').disabled=false;
 }
 else{
  var right=FLOW.answers.filter(function(a,i){return a&&a.pick===L.qs[i].a;}).length;
  var all=right===L.qs.length;
  DB.ev[FLOW.topic]={s:all?'demonstrated':'developing',d:todayISO()};
  var nxt=recommend().filter(function(r){return r.topic!==FLOW.topic;})[0];
  body.innerHTML='<div class="done-mark">'+I.check.replace('<svg','<svg width="26" height="26"')+'</div>'
   +'<h2>'+(all?'Topic shown':'Partly there')+'</h2>'
   +'<p class="lede" style="margin-top:var(--s2)">'+right+' of '+L.qs.length+' correct. '
   +(all?esc(tName(FLOW.topic))+' now counts as shown in checks.':'Marked as developing. Worth one more pass later.')+'</p>'
   +'<div class="list" style="margin-top:var(--s6)"><div class="rowbtn" style="cursor:default">'
    +'<div class="grow"><div class="tt" style="font-weight:600">How sure do you feel now?</div>'
    +'<div class="meta">Your own read, kept separate from the check</div></div></div>'
    +'<div style="padding:var(--s3) var(--s4);display:flex;gap:var(--s2)">'
    +['got','shaky','lost'].map(function(k){
      return '<button class="chip" aria-pressed="'+(DB.conf[FLOW.topic]===k?'true':'false')+'" style="flex:1;justify-content:center" onclick="setConf(\''+FLOW.topic+'\',\''+k+'\',true)">'+CONF_LABEL[k]+'</button>';}).join('')
    +'</div></div>'
   +(nxt?'<div class="sect-h"><h2>Next</h2></div><div class="list"><button class="rowbtn" onclick="closeFlowThen('+JSON.stringify(JSON.stringify(nxt)).replace(/"/g,'&quot;')+')">'
     +'<div class="grow"><div class="tt" style="font-weight:550">'+esc(nxt.title)+'</div><div class="meta">'+esc(nxt.why)+' · '+nxt.mins+' min</div></div>'
     +'<span class="chev">'+I.chev+'</span></button></div>':'');
  foot.innerHTML='<button class="btn btn-primary" onclick="finishFlow()">Done</button>';
  say(all?'Topic shown in checks':'Marked developing');
 }
 document.getElementById('flowBody').scrollTop=0;
 document.getElementById('flow').scrollTop=0;
}
var CONF_LABEL={got:'Got it',shaky:'Shaky',lost:'Lost'};
function pick(qi,i){
 FLOW.answers[qi]={pick:i,locked:false};renderFlow();
}
function lockAnswer(qi){
 if(!FLOW.answers[qi])return;
 FLOW.answers[qi].locked=true;renderFlow();
 var L=LESSON[FLOW.topic];
 say(FLOW.answers[qi].pick===L.qs[qi].a?'Correct':'Incorrect. Explanation shown.');
}
function flowNext(){FLOW.step++;DB.progressTask=FLOW;renderFlow();}
document.getElementById('flowBack').addEventListener('click',function(){if(FLOW&&FLOW.step>0){FLOW.step--;renderFlow();}});
document.getElementById('flowExit').addEventListener('click',function(){exitFlow();});
function exitFlow(){
 if(!FLOW)return;
 var L=LESSON[FLOW.topic];
 var mid=FLOW.step>0&&FLOW.step<2+L.qs.length;
 document.getElementById('flow').classList.remove('on');
 document.body.style.overflow='';
 if(mid){DB.progressTask=FLOW;toast('Saved. Pick up where you left off.');}
 else DB.progressTask=null;
 FLOW=null;renderAll();
}
function finishFlow(){
 document.getElementById('flow').classList.remove('on');
 document.body.style.overflow='';
 DB.progressTask=null;FLOW=null;renderAll();show('next');
}
function closeFlowThen(json){
 document.getElementById('flow').classList.remove('on');document.body.style.overflow='';
 DB.progressTask=null;FLOW=null;renderAll();
 try{startTask(JSON.parse(json));}catch(e){show('next');}
}

/* ══ CONFIDENCE ══ */
function setConf(t,v,inFlow){
 var prev=DB.conf[t];
 if(v==='none')delete DB.conf[t];else DB.conf[t]=v;
 renderAll();
 if(!inFlow)closeSheet();
 else{var host=document.getElementById('flowBody');if(host&&FLOW)renderFlow();}
 toast(tName(t)+': '+(v==='none'?'not rated':CONF_LABEL[v]),function(){
  if(prev)DB.conf[t]=prev;else delete DB.conf[t];renderAll();if(FLOW)renderFlow();
 });
}
function openConfSheet(t){
 var cur=DB.conf[t]||'none';
 var opts=[['got','Got it','Offer a quick check'],['shaky','Shaky','Practice this'],['lost','Lost','Start a recovery task']];
 openSheet('<h3 id="sheetTitle">How sure are you?</h3><p class="lede">'+esc(tName(t))+'</p>'
  +'<div class="list" style="margin-top:var(--s4)">'
  +opts.map(function(o){
    return '<button class="rowbtn" onclick="confPick(\''+t+'\',\''+o[0]+'\')">'
     +'<span class="conf '+o[0]+'" aria-hidden="true">'+(o[0]==='got'?I.check:o[0]==='shaky'?I.half:I.dash)+'</span>'
     +'<span class="grow"><span style="display:block;font-weight:550">'+o[1]+'</span>'
     +'<span class="meta">'+o[2]+'</span></span>'
     +(cur===o[0]?'<span class="pill solid">Current</span>':'')+'</button>';}).join('')
  +'</div>'
  +(cur!=='none'?'<button class="btn btn-quiet" style="margin-top:var(--s3)" onclick="confPick(\''+t+'\',\'none\')">Clear rating</button>':'')
 );
}
function confPick(t,v){
 setConf(t,v);
 if(v==='got'&&hasLesson(t)&&evOf(t)!=='demonstrated')
  setTimeout(function(){startTask({kind:'recheck',topic:t,mins:4,title:'Quick check',why:'Confirm it'});},260);
 else if(v==='lost'&&hasLesson(t))
  setTimeout(function(){startTask({kind:'catchup',topic:t,mins:9,title:'Rebuild',why:'You marked this Lost'});},260);
}

/* ══ TOPIC DETAIL ══ */
function openTopicSheet(t,note){
 var cov=covered()[t],ev=evOf(t),u=tUnit(t);
 openSheet('<h3 id="sheetTitle">'+esc(tName(t))+'</h3><p class="lede">Topic '+t+' · Unit '+u+' '+esc(unitName(u))+'</p>'
  +(note?'<div class="banner" style="margin-top:var(--s4)">'+esc(note)+'</div>':'')
  +'<div class="list" style="margin-top:var(--s4)">'
  +row('In class',cov?'Covered '+fmtD(cov):'Not covered yet')
  +row('You feel',DB.conf[t]?CONF_LABEL[DB.conf[t]]:'Not rated')
  +row('Checks',EV_TEXT[ev]+(evDate(t)?' · '+fmtD(evDate(t)):'')+(evStale(t)?' · recheck due':''))
  +row('Tute','Unit '+u+' · '+TUTE_LABEL[DB.tutes[u]||'assigned'])
  +'</div>'
  +'<div class="stack" style="margin-top:var(--s4)">'
  +(hasLesson(t)?'<button class="btn btn-primary" onclick="closeSheet();startTask({kind:\'catchup\',topic:\''+t+'\',mins:9})">'+(ev==='untested'?'Study and check':'Check again')+'</button>':'')
  +'<button class="btn btn-secondary" onclick="closeSheet();openConfSheet(\''+t+'\')">Change how sure you feel</button>'
  +'</div>');
}
function row(k,v){return '<div class="rowbtn" style="cursor:default;min-height:48px"><span class="grow meta">'+esc(k)+'</span><span style="font-size:var(--t-sm);text-align:right">'+esc(v)+'</span></div>';}
var EV_TEXT={untested:'Not checked yet',developing:'Developing',demonstrated:'Shown in checks'};
var TUTE_LABEL={assigned:'Assigned',started:'Started',done:'Done',fix:'Needs another pass'};

/* ══ SCREEN: DO NEXT ══ */
function renderNext(){
 document.getElementById('hdrTitle').textContent=dowName(todayISO());
 document.getElementById('hdrSub').textContent=fmtD(todayISO())+' · '+ME.batch+' batch';
 var recs=recommend(),el=document.getElementById('nextSlot');
 var resume=DB.progressTask;
 var top=recs[0],rest=recs.slice(1,4);
 var lc=lastClass(),nx=nextClassISO(),days=daysBetween(todayISO(),CFG.exam.date);

 var primary;
 if(resume){
  primary='<div class="primary"><div class="kind">'+KIND[resume.kind][1].replace('<svg','<svg width="14" height="14"')+'In progress</div>'
   +'<h2>'+esc(tName(resume.topic))+'</h2><p class="why">You stopped part way through</p>'
   +'<button class="btn" onclick="startTask({kind:\''+resume.kind+'\',topic:\''+resume.topic+'\'})">Resume</button></div>';
 }else if(top){
  primary='<div class="primary"><div class="kind">'+KIND[top.kind][1].replace('<svg','<svg width="14" height="14"')+esc(KIND[top.kind][0])
   +'<span class="dot"></span>'+top.mins+' min</div>'
   +'<h2>'+esc(top.title.replace(/^Catch up: /,''))+'</h2><p class="why">'+esc(top.why)+'</p>'
   +'<button class="btn" onclick="startTask('+recJSON(top)+')">'+(top.kind==='tute'?'Open tute':top.kind==='papers'?'Open papers':'Start')+'</button></div>';
 }else{
  primary='<div class="card"><h2>Nothing urgent</h2><p class="lede" style="margin-top:var(--s2)">'
   +'You are level with the class. A short review keeps it that way.</p>'
   +'<button class="btn btn-primary" style="margin-top:var(--s4)" onclick="show(\'learn\');seg(\'syllabus\')">Review a topic</button></div>';
 }

 var thenList=rest.length?'<div class="sect-h"><h2>Then</h2></div><div class="list">'
  +rest.map(function(r){
   return '<button class="rowbtn taskrow" onclick="startTask('+recJSON(r)+')">'
    +'<span class="grow"><span class="tt">'+esc(r.title)+'</span>'
    +'<span class="tw">'+esc(r.why)+' · '+r.mins+' min</span></span>'
    +'<span class="chev">'+I.chev+'</span></button>';}).join('')+'</div>':'';

 el.innerHTML=primary+thenList
  +'<div class="sect-h"><h2>Class</h2></div>'
  +'<div class="list">'
   +'<div class="rowbtn" style="cursor:default"><span class="grow"><span class="tt">Next</span>'
    +'<span class="tw">'+CFG.klass.label+' '+fmtD(nx)+' · '+CFG.klass.where+'</span></span></div>'
   +'<div class="rowbtn" style="cursor:default"><span class="grow"><span class="tt">Last lesson</span>'
    +'<span class="tw">'+(lc?lc.topics.map(function(t){return tName(t);}).join(', '):'None yet')+'</span></span></div>'
   +'<a class="rowbtn" href="https://wa.me/'+CFG.wa+'?text='+encodeURIComponent('Hi Leon, '+ME.name.split(' ')[0]+' here from the '+ME.batch+' batch. ')+'" target="_blank" rel="noopener">'
    +'<span class="grow"><span class="tt">Ask Leon</span><span class="tw">WhatsApp</span></span><span class="chev">'+I.chev+'</span></a>'
  +'</div>'
  +'<p class="meta" style="margin-top:var(--s5);text-align:center">'+days+' days to the '+esc(CFG.exam.label)+' exam</p>';
}
function recJSON(r){return JSON.stringify(JSON.stringify(r)).replace(/"/g,'&quot;').replace(/^&quot;|&quot;$/g,"'");}
/* startTask accepts either an object or a JSON string */
var _startTask=startTask;
startTask=function(r){ if(typeof r==='string'){try{r=JSON.parse(r);}catch(e){return;}} _startTask(r); };

/* ══ SCREEN: LEARN ══ */
var SYL_FILTER='next';
var FILTERS=[['next','Do next'],['attention','Needs attention'],['untested','Not checked'],['shown','Shown'],['all','All topics']];
function topicMatches(t,f){
 var cov=covered()[t];
 if(f==='all')return true;
 if(f==='next')return !!cov&&evOf(t)!=='demonstrated';
 if(f==='attention')return !!cov&&(DB.conf[t]==='lost'||DB.conf[t]==='shaky'||evOf(t)==='developing'||evStale(t));
 if(f==='untested')return !!cov&&evOf(t)==='untested';
 if(f==='shown')return evOf(t)==='demonstrated';
 return true;
}
function renderSyllabus(){
 document.getElementById('sylFilters').innerHTML=FILTERS.map(function(f){
  var n=flatTopics().filter(function(t){return topicMatches(t,f[0]);}).length;
  return '<button class="chip" aria-pressed="'+(SYL_FILTER===f[0]?'true':'false')+'" onclick="setFilter(\''+f[0]+'\')">'
   +esc(f[1])+'<span class="num" style="opacity:.6">'+n+'</span></button>';}).join('');
 var cov=covered();
 /* current unit = the newest unit with any covered topic */
 var curUnit='1';flatTopics().forEach(function(t){if(cov[t])curUnit=tUnit(t);});
 var body=SYLLABUS.map(function(u){
  var list=u.topics.filter(function(t){return topicMatches(t[0],SYL_FILTER);});
  if(!list.length)return '';
  var open=(SYL_FILTER!=='all')||u.u===curUnit;
  var covN=u.topics.filter(function(t){return cov[t[0]];}).length;
  return '<div class="list"><button class="unit-h" aria-expanded="'+(open?'true':'false')+'" onclick="toggleUnit(this)">'
   +'<span class="un">Unit '+u.u+' · '+esc(u.name)+'</span>'
   +'<span class="uc num">'+covN+'/'+u.topics.length+'</span><span class="caret">'+I.caret+'</span></button>'
   +'<div class="unit-body"'+(open?'':' hidden')+'>'
   +list.map(function(t){
     var id=t[0],c=cov[id],ev=evOf(id),cf=DB.conf[id]||'';
     return '<div class="topic'+(c?'':' future')+'">'
      +'<button class="conf '+cf+'" aria-label="How sure you feel about '+esc(t[1])+'" onclick="openConfSheet(\''+id+'\')">'
       +(cf==='got'?I.check:cf==='shaky'?I.half:cf==='lost'?I.dash:'')+'</button>'
      +'<button class="grow" style="min-height:44px" onclick="openTopicSheet(\''+id+'\')">'
       +'<span class="tn">'+esc(t[1])+'</span>'
       +'<span class="tsub"><span class="stat'+(c?' on':'')+'">'+esc(c?'Covered '+fmtD(c):'Not covered')+'</span>'
       +'<span class="stat'+(ev==='demonstrated'?' on':'')+'">'+esc(EV_TEXT[ev])+'</span></span>'
      +'</button><span class="chev">'+I.chev+'</span></div>';
   }).join('')+'</div></div>';
 }).filter(Boolean).join('');
 document.getElementById('sylBody').innerHTML=body||emptyState('Nothing here','No topics match this filter yet.');
}
function setFilter(f){SYL_FILTER=f;renderSyllabus();say(f+' filter');}
function toggleUnit(btn){
 var open=btn.getAttribute('aria-expanded')==='true';
 btn.setAttribute('aria-expanded',open?'false':'true');
 btn.parentNode.querySelector('.unit-body').hidden=open;
}
function emptyState(t,s){return '<div class="empty"><div class="ei">'+I.book.replace('<svg','<svg width="20" height="20"')+'</div>'
 +'<h3>'+esc(t)+'</h3><p class="lede" style="margin-top:var(--s1)">'+esc(s)+'</p></div>';}

function renderTutes(){
 var cov=covered();
 var units=SYLLABUS.filter(function(u){return u.topics.some(function(t){return cov[t[0]];});});
 document.getElementById('tuteBody').innerHTML=units.length?'<div class="list">'+units.map(function(u){
  var s=DB.tutes[u.u]||'assigned';
  return '<button class="rowbtn" onclick="openTuteSheet(\''+u.u+'\')">'
   +'<span class="grow"><span class="tt" style="font-weight:550">Unit '+u.u+' · '+esc(u.name)+'</span>'
   +'<span class="tw">'+TUTE_LABEL[s]+'</span></span><span class="chev">'+I.chev+'</span></button>';
 }).join('')+'</div>':emptyState('No tutes yet','They appear once your class covers a unit.');
}
function openTuteSheet(u){
 var cur=DB.tutes[u]||'assigned';
 openSheet('<h3 id="sheetTitle">Unit '+u+' tute</h3><p class="lede">'+esc(unitName(u))+'</p>'
  +'<div class="list" style="margin-top:var(--s4)">'
  +['assigned','started','done','fix'].map(function(k){
    return '<button class="rowbtn" onclick="setTute(\''+u+'\',\''+k+'\')"><span class="grow">'+TUTE_LABEL[k]+'</span>'
     +(cur===k?'<span class="pill solid">Current</span>':'')+'</button>';}).join('')
  +'</div><p class="meta" style="margin-top:var(--s4)">Your own record. Rewards are not affected.</p>');
}
function setTute(u,v){
 var prev=DB.tutes[u];DB.tutes[u]=v;closeSheet();renderAll();
 toast('Unit '+u+' tute: '+TUTE_LABEL[v],function(){DB.tutes[u]=prev;renderAll();});
}

/* ══ PAPERS: comparable only, guided logging ══ */
function comparable(p){return DB.papers.filter(function(x){return x.max===p.max&&x.timed===p.timed;});}
function paperInsights(){
 var out=[],e={};
 DB.papers.forEach(function(p){if(p.err)e[p.err]=(e[p.err]||0)+1;});
 var top=Object.keys(e).sort(function(a,b){return e[b]-e[a];})[0];
 if(top&&e[top]>=2)out.push({t:top+' is your most repeated issue',s:'In '+e[top]+' of '+DB.papers.length+' attempts',
  act:'Practise it',go:function(){show('learn');seg('papers');}});
 var timed=DB.papers.filter(function(p){return p.timed&&p.max===20;});
 if(timed.length>=3){
  var last3=timed.slice(-3),up=last3[2].score>last3[0].score;
  out.push({t:up?'Your timed answers are improving':'Timed scores have held steady',
   s:last3.map(function(p){return p.score;}).join(' then ')+' out of 20'});
 }
 var recent=DB.papers.slice(-2);
 if(recent.length===2&&recent.every(function(p){return p.err!=='Terminology';}))
  out.push({t:'No terminology slips recently',s:'Last two attempts were clean on that'});
 return out;
}
function renderPapers(){
 var el=document.getElementById('paperBody');
 if(!DB.papers.length){el.innerHTML=emptyState('No attempts yet','Log one and patterns start showing.')
  +'<button class="btn btn-primary" style="margin-top:var(--s4)" onclick="logPaper()">Log an attempt</button>';return;}
 var ins=paperInsights();
 el.innerHTML=(ins.length?'<div class="list">'+ins.map(function(i){
   return '<div class="rowbtn" style="cursor:default"><span class="grow"><span class="tt" style="font-weight:550">'+esc(i.t)+'</span>'
    +'<span class="tw">'+esc(i.s)+'</span></span></div>';}).join('')+'</div>':'')
  +'<button class="btn btn-primary" style="margin-top:var(--s3)" onclick="logPaper()">Log an attempt</button>'
  +'<div class="sect-h"><h2>Recent</h2></div><div class="list">'
  +DB.papers.slice(-6).reverse().map(function(p){
    var comp=comparable(p);
    return '<div class="rowbtn" style="cursor:default"><span class="grow">'
     +'<span class="tt" style="font-weight:550">'+esc(p.paper+' '+p.q)+'</span>'
     +'<span class="tw">'+(p.timed?'Timed':'Untimed')+' · '+(p.marker==='tutor'?'Marked by Leon':'Self-marked')
     +(p.err?' · '+esc(p.err):'')+(comp.length>1?' · '+comp.length+' comparable':'')+'</span></span>'
     +'<span class="num" style="font-weight:650">'+p.score+'/'+p.max+'</span></div>';}).join('')
  +'</div>';
}
/* guided, one decision per screen */
var PL=null;
function logPaper(){
 PL={step:0,paper:'',q:'',score:'',max:'20',timed:null,err:''};
 renderPL();
 document.getElementById('flow').classList.add('on');document.body.style.overflow='hidden';
}
function renderPL(){
 var body=document.getElementById('flowBody'),foot=document.getElementById('flowFoot'),s=PL.step;
 document.getElementById('flowProg').style.width=Math.round(s/5*100)+'%';
 document.getElementById('flowBack').style.visibility=s===0?'hidden':'visible';
 var recentPapers=[];DB.papers.slice(-4).reverse().forEach(function(p){if(recentPapers.indexOf(p.paper)<0)recentPapers.push(p.paper);});
 if(s===0){
  body.innerHTML='<h2>Which paper?</h2><div class="stack" style="margin-top:var(--s4)">'
   +(recentPapers.length?'<div class="chipbar">'+recentPapers.map(function(p){
     return '<button class="chip" onclick="plSet(\'paper\',this.textContent);">'+esc(p)+'</button>';}).join('')+'</div>':'')
   +'<div><label for="plPaper">Paper</label><input id="plPaper" placeholder="2021 Paper I" value="'+esc(PL.paper)+'" oninput="PL.paper=this.value;plValid()"></div>'
   +'<div><label for="plQ">Question or section</label><input id="plQ" placeholder="Q3" value="'+esc(PL.q)+'" oninput="PL.q=this.value;plValid()"></div></div>';
  foot.innerHTML='<button class="btn btn-primary" id="plNext" onclick="PL.step++;renderPL()">Continue</button>';
  plValid();
 }else if(s===1){
  body.innerHTML='<h2>What did you score?</h2>'
   +'<div class="stack" style="margin-top:var(--s4)">'
   +'<div><label for="plScore">Your score</label><input id="plScore" inputmode="numeric" pattern="[0-9]*" value="'+esc(PL.score)+'" oninput="PL.score=this.value;plValid()"></div>'
   +'<div><label for="plMax">Out of</label><input id="plMax" inputmode="numeric" pattern="[0-9]*" value="'+esc(PL.max)+'" oninput="PL.max=this.value;plValid()"></div>'
   +'<p class="meta" id="plErr" role="alert"></p></div>';
  foot.innerHTML='<button class="btn btn-primary" id="plNext" onclick="PL.step++;renderPL()">Continue</button>';
  plValid();
 }else if(s===2){
  body.innerHTML='<h2>Timed?</h2><p class="lede" style="margin-top:var(--s2)">Only timed attempts are compared with other timed attempts.</p>'
   +'<div style="margin-top:var(--s4)">'
   +[['true','Timed'],['false','Untimed']].map(function(o){
     return '<button class="qopt" aria-checked="'+(String(PL.timed)===o[0]?'true':'false')+'" role="radio" onclick="PL.timed=('+o[0]+');renderPL()">'
      +'<span class="mk">'+I.check+'</span><span>'+o[1]+'</span></button>';}).join('')+'</div>';
  foot.innerHTML='<button class="btn btn-primary" '+(PL.timed===null?'disabled':'')+' onclick="PL.step++;renderPL()">Continue</button>';
 }else if(s===3){
  var errs=['Knowledge gap','Misread question','Application','Answer structure','Terminology','Time management','Careless'];
  body.innerHTML='<h2>What cost you marks?</h2><p class="lede" style="margin-top:var(--s2)">Optional. This is what makes the pattern useful.</p>'
   +'<div style="margin-top:var(--s4)">'+errs.map(function(e){
     return '<button class="qopt" role="radio" aria-checked="'+(PL.err===e?'true':'false')+'" onclick="PL.err=(PL.err===\''+e+'\'?\'\':\''+e+'\');renderPL()">'
      +'<span class="mk">'+I.check+'</span><span>'+e+'</span></button>';}).join('')
   +'<button class="btn btn-quiet" style="margin-top:var(--s4)" onclick="PL.err=\'\';PL.step++;renderPL()">Nothing in particular</button></div>';
  foot.innerHTML='<button class="btn btn-primary" onclick="PL.step++;renderPL()">Continue</button>';
 }else if(s===4){
  var pct=Math.round(+PL.score/+PL.max*100);
  body.innerHTML='<h2>Check this</h2><div class="list" style="margin-top:var(--s4)">'
   +row('Paper',PL.paper+' '+PL.q)+row('Score',PL.score+' of '+PL.max+' · '+pct+'%')
   +row('Conditions',PL.timed?'Timed':'Untimed')+row('Main problem',PL.err||'None recorded')
   +'</div><p class="meta" style="margin-top:var(--s4)">Saved as self-marked.</p>';
  foot.innerHTML='<button class="btn btn-primary" onclick="savePaper()">Save attempt</button>';
 }else{
  var p=DB.papers[DB.papers.length-1],comp=comparable(p).filter(function(x){return x!==p;});
  var pctv=Math.round(p.score/p.max*100);
  var better=comp.length?comp.filter(function(x){return x.score<p.score;}).length:0;
  body.innerHTML='<div class="done-mark">'+I.check.replace('<svg','<svg width="26" height="26"')+'</div>'
   +'<h2>'+pctv+'%</h2>'
   +'<p class="lede" style="margin-top:var(--s2)">'
   +(comp.length?'Compared with '+comp.length+' other '+(p.timed?'timed':'untimed')+' attempt'+(comp.length>1?'s':'')+' out of '+p.max+'. You beat '+better+' of them.'
     :'First attempt of this type, so there is nothing comparable yet.')+'</p>'
   +(p.err?'<div class="verdict" style="margin-top:var(--s5)"><div class="vt">'+esc(p.err)+'</div>'
     +'<p class="lede">'+esc(errAdvice(p.err))+'</p></div>':'');
  foot.innerHTML='<button class="btn btn-primary" onclick="closePL()">Done</button>';
  say('Attempt saved. '+pctv+' percent.');
 }
}
function errAdvice(e){
 return {'Application':'Practise linking theory to the case in the question.',
  'Answer structure':'Plan two lines before writing. Point, reason, example.',
  'Terminology':'Learn the exact words the marking scheme rewards.',
  'Time management':'Time your next attempt strictly and stop when time is up.',
  'Knowledge gap':'Go back to the topic before the next attempt.',
  'Misread question':'Underline the command word before you start.',
  'Careless':'Read your answer once before moving on.'}[e]||'Worth another pass.';
}
function plSet(k,v){PL[k]=v;renderPL();}
function plValid(){
 var b=document.getElementById('plNext');if(!b)return;
 if(PL.step===0){b.disabled=!(PL.paper.trim()&&PL.q.trim());}
 if(PL.step===1){
  var s=+PL.score,m=+PL.max,ok=PL.score!==''&&PL.max!==''&&!isNaN(s)&&!isNaN(m)&&m>0&&s>=0&&s<=m;
  b.disabled=!ok;
  var e=document.getElementById('plErr');
  if(e)e.textContent=(PL.score!==''&&PL.max!==''&&!ok)?'Score must be between 0 and the maximum.':'';
 }
}
function savePaper(){
 DB.papers.push({date:todayISO(),paper:PL.paper.trim(),q:PL.q.trim(),score:+PL.score,max:+PL.max,
  timed:!!PL.timed,marker:'self',err:PL.err});
 PL.step=5;renderPL();renderAll();
}
function closePL(){document.getElementById('flow').classList.remove('on');document.body.style.overflow='';PL=null;renderAll();}

/* ══ SPLASH ══════════════════════════════════════════════════════════════
   Written for a 17-year-old sitting an A/L, not for a poster. Nothing here
   promises a grade, praises them for opening an app, or tells them off.
   Deterministic by date: two students opening it the same morning see the
   same line, and there is no randomness anywhere in this app. ══ */
var SPLASH_LINES=[
 'The topic you keep avoiding is the one on the paper.',
 'Ten honest minutes beat an hour of pretending.',
 'You do not have to feel ready. You have to start.',
 'Every mistake you fix now is a mark you keep later.',
 'Understanding is quiet. Memorising is loud, and it forgets.',
 'Small, repeated, unglamorous. That is the whole method.',
 'The work is boring. Walking in prepared is not.'
];
function splashLine(){
 var p=todayISO().split('-');
 var n=(+p[0]*372)+(+p[1]*31)+(+p[2]);
 return SPLASH_LINES[n%SPLASH_LINES.length];
}
var SPLASH_T=null;
function hideSplash(){
 var el=document.getElementById('splash');
 if(!el||el.classList.contains('gone'))return;
 clearTimeout(SPLASH_T);
 el.classList.add('gone');
 setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},360);
}
function showSplash(){
 var el=document.getElementById('splash');if(!el)return;
 document.getElementById('spLine').textContent=splashLine();
 var d=daysBetween(todayISO(),CFG.exam.date);
 document.getElementById('spFoot').textContent=d>0?d+' days to the exam':'Exam time';
 /* time-boxed. It never stands between a student and the app. */
 SPLASH_T=setTimeout(hideSplash,1200);
}

/* ══════════════════════════════════════════════════════════════════════
   HARNESS. Run BSWL_TEST() in the console.
   ══════════════════════════════════════════════════════════════════════ */
function BSWL_TEST(){
 var P=0,F=0,out=[];
 function ok(n,c,x){if(c)P++;else F++;out.push((c?'PASS':'FAIL')+' · '+n+(x?' · '+x:''));}
 /* L-GYM-008: a harness that mutates shared state must restore it, or a second
    run reports failures that are only the first run's leftovers. */
 var SNAP=JSON.stringify(DB), SNAP_ME=ME, SNAP_IN=document.getElementById('login').classList.contains('gone');
 function restore(){
  var d=JSON.parse(SNAP);Object.keys(d).forEach(function(k){DB[k]=d[k];});
  ME=SNAP_ME;
  document.getElementById('login').classList.toggle('gone',SNAP_IN);
  try{renderAll();}catch(e){}
 }
 try{
  /* THE defect this redesign existed to fix */
  var recs=recommend();
  ok('Primary action exists and names a task',!!recs[0]&&recs[0].title.length>3,recs[0].title);
  ok('Every recommendation carries a reason and a duration',
     recs.every(function(r){return r.why&&r.why.length>4&&r.mins>0;}));
  ok('Top action is missed-class recovery',recs[0].kind==='catchup',recs[0].kind);
  ok('Recovery capped at three',recs.filter(function(r){return r.p<=7;}).length<=3);
  var t=recs[0].topic;
  startTask(recs[0]);
  ok('Start opens the task flow, not a list',document.getElementById('flow').classList.contains('on'));
  ok('The flow is about the promised topic',FLOW&&FLOW.topic===t,FLOW&&FLOW.topic);
  ok('Flow opens on context, not a question',FLOW.step===0);
  flowNext();flowNext();
  ok('Reaches a question',FLOW.step===2);
  var L=LESSON[t];
  pick(0,L.qs[0].a);lockAnswer(0);
  ok('Answering shows a verdict, not just right or wrong',
     document.getElementById('flowBody').textContent.indexOf(L.qs[0].why.slice(0,18))>=0);
  while(FLOW.step<flowSteps()-1){if(FLOW.step>=2&&FLOW.step<2+L.qs.length){var qi=FLOW.step-2;pick(qi,L.qs[qi].a);lockAnswer(qi);}flowNext();}
  ok('Completing writes dated evidence',DB.ev[t]&&DB.ev[t].s==='demonstrated'&&DB.ev[t].d===todayISO());
  finishFlow();
  ok('Finishing closes the flow',!document.getElementById('flow').classList.contains('on'));
  /* resume */
  var r2=recommend()[0];
  if(r2&&r2.topic&&LESSON[r2.topic]){startTask(r2);flowNext();exitFlow();
   ok('Exiting mid-task saves a resume point',!!DB.progressTask);
   ok('Resume shows on Do next',document.getElementById('nextSlot').textContent.indexOf('Resume')>=0);
   DB.progressTask=null;renderAll();}
  /* separation of the three truths */
  var evB=JSON.stringify(DB.ev);
  setConf('5.1','got');
  ok('Confidence never writes evidence',JSON.stringify(DB.ev)===evB);
  delete DB.conf['5.1'];
  ok('Missing data reads as not checked, never as known',evOf('8.3')==='untested');
  /* rewards */
  var snap=JSON.stringify(rewards()),tu=JSON.stringify(DB.tutes);
  Object.keys(DB.tutes).forEach(function(k){DB.tutes[k]='done';});
  DB.papers.push({date:todayISO(),paper:'h',q:'x',score:20,max:20,timed:true,marker:'self',err:''});
  ok('No reward moves on self-reported input',JSON.stringify(rewards())===snap);
  DB.papers.pop();DB.tutes=JSON.parse(tu);
  ok('Unconfirmed benefit is labelled pending',rewards().some(function(r){return r.pending;}));
  /* papers compared honestly */
  var p1={max:20,timed:true},p2={max:20,timed:false};
  ok('Timed and untimed are never pooled',comparable(p1).every(function(x){return x.timed===true;}));
  ok('Different maximums are never pooled',comparable(p2).every(function(x){return x.max===20;}));
  /* validation */
  PL={step:1,paper:'a',q:'b',score:'25',max:'20',timed:true,err:''};renderPL();
  ok('Score above the maximum is blocked',document.getElementById('plNext').disabled===true);
  closePL();
  /* copy discipline */
  var txt=document.body.innerText;
  ok('No philosophy essays in the primary screen',txt.indexOf('kept separate on purpose')<0&&txt.indexOf('No shame')<0&&txt.indexOf('game it')<0);
  ok('Topic numbers are not the headline',document.querySelector('.primary h2').textContent.indexOf('4.2')<0);
  /* the bug eyes caught and checks could not: stacked lines inside a button
     must be block, or the title runs straight into the subtitle */
  var runOn=0,measured=0;
  document.querySelectorAll('.tt').forEach(function(el){
   var sib=el.parentNode.querySelector('.tw');
   if(!sib||!el.offsetParent)return;              /* hidden screens report 0,0 for both */
   var a=el.getBoundingClientRect(),b=sib.getBoundingClientRect();
   if(!a.height||!b.height)return;
   measured++;
   if(Math.abs(a.top-b.top)<4)runOn++;});
  ok('Row titles and subtitles are on separate lines',runOn===0&&measured>0,runOn+' run together of '+measured+' measured');
  /* splash: it must inform, never block, never promise */
  ok('Splash line is deterministic by date',splashLine()===splashLine()&&SPLASH_LINES.indexOf(splashLine())>-1);
  ok('Splash lines promise no grade and no praise',
     SPLASH_LINES.every(function(l){return !/\bA grade|guarantee|you will pass|well done|amazing|great job/i.test(l);}));
  ok('Splash lines are a readable length',SPLASH_LINES.every(function(l){return l.length>24&&l.length<70;}));
  ok('Splash can be dismissed',(function(){var e=document.getElementById('splash');
     if(!e)return true; hideSplash(); return e.classList.contains('gone');})());

  /* login: three demo accounts, wrong password refused, right one lets you in */
  ok('Login screen is present and blocks the app',!!document.getElementById('login'));
  ok('Three student accounts exist',STUDENTS.length===3);
  doLogout();                                   /* start from a known state */
  document.getElementById('lgUser').value='Nadun';document.getElementById('lgPin').value='9999';
  doLogin();
  ok('A wrong password is refused',document.getElementById('lgErr').textContent.length>10
     &&!document.getElementById('login').classList.contains('gone'));
  document.getElementById('lgPin').value='1010';doLogin();
  ok('Nadun 1010 signs in',document.getElementById('login').classList.contains('gone')&&ME.user==='Nadun');
  ok('The signed-in student drives the app',document.querySelector('#progressSlot').textContent.indexOf('Nadun')>=0);
  doLogout();
  ok('Sign out returns to the login screen',!document.getElementById('login').classList.contains('gone'));
  document.getElementById('lgUser').value='Nadun';document.getElementById('lgPin').value='1010';doLogin();
  /* a11y */
  var unlabelled=0;
  document.querySelectorAll('button').forEach(function(b){
   if(!b.textContent.trim()&&!b.getAttribute('aria-label'))unlabelled++;});
  ok('Every button has an accessible name',unlabelled===0,unlabelled+' unlabelled');
  ok('Tabs expose selection state',document.getElementById('tab-next').getAttribute('aria-selected')==='true');
  var small=0;
  document.querySelectorAll('.tabs button,.btn,.conf').forEach(function(e){
   var r=e.getBoundingClientRect();if(r.height&&r.height<44)small++;});
  ok('Primary touch targets are at least 44px',small===0,small+' under');
  /* monochrome */
  var chroma=0;
  document.querySelectorAll('.card,.btn,.primary,.list,.chip').forEach(function(e){
   var c=getComputedStyle(e).color.match(/\d+/g);if(c&&(+c[0]!==+c[1]||+c[1]!==+c[2]))chroma++;});
  ok('Monochrome holds',chroma===0);
  /* safe area */
  var root=document.documentElement;
  root.style.setProperty('--sat','59px');
  ok('Status fill follows a 59px inset',Math.abs(document.querySelector('.statusfill').getBoundingClientRect().height-59)<1.5);
  root.style.setProperty('--sat','0px');
  ok('And collapses at 0',document.querySelector('.statusfill').getBoundingClientRect().height<1.5);
  root.style.removeProperty('--sat');
  /* layout */
  ok('No horizontal overflow',document.documentElement.scrollWidth<=window.innerWidth+1,
     document.documentElement.scrollWidth+' vs '+window.innerWidth);
  ok('Progress leads with a counted metric, not a bare percentage',
     document.getElementById('progressSlot').textContent.indexOf('covered topics shown')>=0);
  /* privacy */
  var src=document.documentElement.outerHTML;
  ok('No fee or debt wording',!/\bfee\b|\bfees\b|\bowes?\b|\bLKR\b/i.test(src.replace(new RegExp('<scr'+'ipt[\\s\\S]*<\\/scr'+'ipt>'),'')));
  ok('No API keys',!/eyJ[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}/.test(src));
  ok('Zero em dashes',src.indexOf('\u2014')<0&&src.indexOf('\u2013')<0);
  ok('Draft lesson content is labelled',JSON.stringify(LESSON).length>0&&src.indexOf('pending Leon')>=0);
 }catch(e){F++;out.push('FAIL · harness crashed · '+(e&&e.message));}
 finally{restore();}
 console.log(out.join('\n'));console.log(P+' passed, '+F+' failed');
 return {pass:P,fail:F,lines:out};
}
</script>
